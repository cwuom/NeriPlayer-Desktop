name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.json'
      - '.github/scripts/sync_labels.cjs'
      - '.github/workflows/sync_labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { syncLabels } = require('./.github/scripts/sync_labels.cjs');
            await syncLabels({ github, context, core });
