name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - 'docs/**'
      - 'docs-private/**'
      - '.report/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'NOTICE'
      - 'NOTICE.*'
      - 'CHANGELOG'
      - 'CHANGELOG.*'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - 'docs/**'
      - 'docs-private/**'
      - '.report/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'NOTICE'
      - 'NOTICE.*'
      - 'CHANGELOG'
      - 'CHANGELOG.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for configuration interoperability tests
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0

      - name: Type-check app and tests
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 回归脚本 + Vitest 单测
      - name: Test frontend
        run: pnpm test

      - name: Unit test coverage
        run: pnpm unit:coverage

      # 与 Android 仓库相同的 CRAP 门禁：受检范围内函数 CRAP > 9 失败，范围外超标数只能下降
      - name: CRAP gate
        run: |
          node --test tools/quality/*.test.mjs
          python3 -B tools/quality/crap_report.py

      - name: Publish frontend coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f coverage/coverage-summary.json ]]; then
            node --input-type=module -e "
              import fs from 'node:fs'
              const total = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total
              const row = (key) => '| ' + key + ' | ' + total[key].pct + '% | ' + total[key].covered + '/' + total[key].total + ' |'
              const lines = ['### Frontend unit coverage', '', '| Metric | % | Covered |', '| --- | --- | --- |',
                ...['lines', 'statements', 'functions', 'branches'].map(row)]
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n') + '\\n')
            "
          fi

      - name: Build frontend
        run: pnpm build

  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # 门禁脚本只用 Python 3.11+ 标准库（tomllib），ubuntu-24.04 自带 3.12
      - name: Test quality tooling
        run: python3 -B -m unittest discover -s tools/quality -p 'test_*.py'

      - name: Check module boundaries
        run: python3 -B tools/quality/module_boundaries.py

      - name: Check IPC contract
        run: python3 -B tools/quality/ipc_contract.py

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: lint

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy (debug)
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # 凭据存储等模块按 debug_assertions 切换实现，release 配置要单独检查
      - name: Clippy (release)
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets --release -- -D warnings

  rust-coverage:
    name: Rust tests and coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: coverage

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.2

      # 全量 workspace 测试在插桩下运行一次，同时产出覆盖率。
      # 下限只升不降：macOS 实测行覆盖率 66.1%，Linux 的 cfg 分支不同，留出余量
      - name: Run workspace tests with coverage
        working-directory: src-tauri
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info --fail-under-lines 60

      - name: Publish Rust coverage summary
        if: always()
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f lcov.info ]]; then
            {
              echo '### Rust coverage (per crate)'
              echo
              echo '```'
              cargo llvm-cov report --summary-only
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lcov
          path: src-tauri/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target }}

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: Test native configuration backups and authentication
        if: ${{ (runner.arch == 'X64' && startsWith(matrix.target, 'x86_64-')) || (runner.arch == 'ARM64' && startsWith(matrix.target, 'aarch64-')) }}
        working-directory: src-tauri
        run: |
          cargo test --locked --workspace --target ${{ matrix.target }} --lib -- config_backup::tests auth:: commands::auth_cmd::tests commands::sync_cmd::tests api::youtube::account::tests api::youtube::client::tests api::youtube::session::tests api::bilibili:: settings::store:: --test-threads=1

  ffmpeg:
    name: FFmpeg
    uses: ./.github/workflows/ffmpeg.yml

  # 用随包分发的那份 FFmpeg 跑解码测试：缺解码器、解封装器或动态库加载不上都会失败
  decoders:
    name: Decoders (${{ matrix.target }})
    needs: ffmpeg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            ffmpeg_target: windows-x86_64
          - platform: macos-15
            target: aarch64-apple-darwin
            ffmpeg_target: macos-aarch64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ffmpeg_target: linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: test-${{ matrix.target }}

      - name: Download FFmpeg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-${{ matrix.ffmpeg_target }}
          path: .cache/ffmpeg-build/${{ matrix.ffmpeg_target }}

      - name: Test decoders against the bundled FFmpeg
        working-directory: src-tauri
        shell: bash
        env:
          NERI_FFMPEG_DIR: ${{ github.workspace }}/.cache/ffmpeg-build/${{ matrix.ffmpeg_target }}
          NERI_REQUIRE_FFMPEG: '1'
        run: |
          cargo test --locked --target ${{ matrix.target }} -p neri-playback --lib -- ffmpeg:: decoder::
