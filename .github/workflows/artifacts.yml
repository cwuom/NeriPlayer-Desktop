name: Artifacts

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - 'docs/**'
      - 'docs-private/**'
      - '.report/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'NOTICE'
      - 'NOTICE.*'
      - 'CHANGELOG'
      - 'CHANGELOG.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-build-metadata:
    name: Prepare build metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      build_epoch: ${{ steps.build_metadata.outputs.build_epoch }}
      build_git_sha: ${{ steps.build_metadata.outputs.build_git_sha }}
      build_uuid: ${{ steps.build_metadata.outputs.build_uuid }}
      build_version: ${{ steps.build_metadata.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Generate shared build metadata
        id: build_metadata
        shell: bash
        run: |
          set -euo pipefail
          build_epoch="$(date +%s)"
          build_git_sha="$(git rev-parse HEAD)"
          build_timestamp="$(TZ=Asia/Taipei date --date="@$build_epoch" +%m%d%H%M)"
          build_version="${build_git_sha:0:7}.${build_timestamp}"
          build_uuid="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          [[ "$build_version" =~ ^[0-9a-f]{7}\.[0-9]{8}$ ]]
          [[ "$build_uuid" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]

          {
            echo "build_epoch=$build_epoch"
            echo "build_git_sha=$build_git_sha"
            echo "build_uuid=$build_uuid"
            echo "build_version=$build_version"
          } >> "$GITHUB_OUTPUT"

          echo "Build version: $build_version"
          echo "Build UUID: $build_uuid"

      - name: Upload build metadata summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "build_uuid=${{ steps.build_metadata.outputs.build_uuid }}"
            echo "build_version=${{ steps.build_metadata.outputs.build_version }}"
            echo "build_git_sha=${{ steps.build_metadata.outputs.build_git_sha }}"
            echo "build_epoch=${{ steps.build_metadata.outputs.build_epoch }}"
            echo "github_sha=${{ github.sha }}"
            echo "github_ref=${{ github.ref }}"
            echo "github_run_id=${{ github.run_id }}"
            echo "github_run_number=${{ github.run_number }}"
          } > artifacts/build-metadata.txt
          {
            echo "### Build metadata"
            echo ""
            echo "- Build UUID: \`${{ steps.build_metadata.outputs.build_uuid }}\`"
            echo "- Build version: \`${{ steps.build_metadata.outputs.build_version }}\`"
            echo "- Git SHA: \`${{ steps.build_metadata.outputs.build_git_sha }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeriPlayer-build-metadata
          path: artifacts/build-metadata.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-artifacts:
    name: Build (${{ matrix.artifact_name }})
    needs: prepare-build-metadata
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      NERI_BUILD_EPOCH: ${{ needs.prepare-build-metadata.outputs.build_epoch }}
      NERI_BUILD_GIT_SHA: ${{ needs.prepare-build-metadata.outputs.build_git_sha }}
      NERI_BUILD_UUID: ${{ needs.prepare-build-metadata.outputs.build_uuid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            artifact_name: macOS-arm64
          - platform: macos-15
            target: x86_64-apple-darwin
            artifact_name: macOS-x64
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            artifact_name: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: Linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate artifact workflow contract
        run: pnpm test:artifacts-workflow

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src-tauri -> target
          shared-key: build-${{ matrix.target }}

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "Build UUID: ${NERI_BUILD_UUID}"
          echo "Build git SHA: ${NERI_BUILD_GIT_SHA}"
          echo "Build epoch: ${NERI_BUILD_EPOCH}"
          {
            echo "### Build metadata (${{ matrix.artifact_name }})"
            echo ""
            echo "- Build UUID: \`${NERI_BUILD_UUID}\`"
            echo "- Build version seed: \`${NERI_BUILD_GIT_SHA:0:7}\`"
            echo "- Shared epoch: \`${NERI_BUILD_EPOCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NERI_BUILD_EPOCH: ${{ env.NERI_BUILD_EPOCH }}
          NERI_BUILD_GIT_SHA: ${{ env.NERI_BUILD_GIT_SHA }}
          NERI_BUILD_UUID: ${{ env.NERI_BUILD_UUID }}
        with:
          args: --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "build_uuid=${NERI_BUILD_UUID}"
            echo "build_git_sha=${NERI_BUILD_GIT_SHA}"
            echo "build_epoch=${NERI_BUILD_EPOCH}"
            echo "artifact_name=${{ matrix.artifact_name }}"
            echo "target=${{ matrix.target }}"
            echo "github_sha=${{ github.sha }}"
            echo "github_run_id=${{ github.run_id }}"
          } > artifacts/build-metadata.txt
          portable_dir="portable"
          portable_stage_dir="portable-stage"
          mkdir -p "$portable_dir" "$portable_stage_dir"
          case "${{ matrix.artifact_name }}" in
            macOS-*)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
              mkdir -p "$portable_stage_dir/macos"
              shopt -s nullglob
              app_bundles=(src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
              if [ "${#app_bundles[@]}" -eq 0 ]; then
                echo "No macOS app bundle found" >&2
                exit 1
              fi
              app_bundle="${app_bundles[0]}"
              cp -R "$app_bundle" "$portable_stage_dir/macos/"
              cp README.md LICENSE artifacts/build-metadata.txt "$portable_stage_dir/macos/"
              tar -czf "$portable_dir/NeriPlayer-${{ matrix.artifact_name }}-portable.tar.gz" -C "$portable_stage_dir" macos
              ;;
            Windows-*)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
              cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
              mkdir -p "$portable_dir/windows"
              release_dir="src-tauri/target/${{ matrix.target }}/release"
              cp "$release_dir/neri-player-desktop.exe" "$portable_dir/windows/NeriPlayer.exe"
              shopt -s nullglob
              for dependency in "$release_dir"/*.dll "$release_dir"/*.pdb; do
                if [ -f "$dependency" ]; then
                  cp "$dependency" "$portable_dir/windows/"
                fi
              done
              cp README.md LICENSE artifacts/build-metadata.txt "$portable_dir/windows/"
              ;;
            Linux-*)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
              cp src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
              for f in src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage; do
                [ -f "$f" ] && tar czf "artifacts/$(basename "$f").tar.gz" -C "$(dirname "$f")" "$(basename "$f")"
              done
              mkdir -p "$portable_stage_dir/linux"
              release_dir="src-tauri/target/${{ matrix.target }}/release"
              cp "$release_dir/neri-player-desktop" "$portable_stage_dir/linux/NeriPlayer"
              cp src-tauri/icons/icon.png "$portable_stage_dir/linux/icon.png"
              cat > "$portable_stage_dir/linux/NeriPlayer.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NeriPlayer
          Comment=Desktop music player
          Exec=./NeriPlayer
          Path=.
          Icon=./icon.png
          Terminal=false
          Categories=AudioVideo;Audio;Player;
          EOF
              chmod +x "$portable_stage_dir/linux/NeriPlayer" "$portable_stage_dir/linux/NeriPlayer.desktop"
              cp README.md LICENSE artifacts/build-metadata.txt "$portable_stage_dir/linux/"
              tar -czf "$portable_dir/NeriPlayer-${{ matrix.artifact_name }}-portable.tar.gz" -C "$portable_stage_dir" linux
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeriPlayer-${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

      - name: Upload portable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeriPlayer-${{ matrix.artifact_name }}-portable
          path: portable
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true
