name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to release
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.build_metadata.outputs.app_version }}
      build_epoch: ${{ steps.build_metadata.outputs.build_epoch }}
      build_git_sha: ${{ steps.build_metadata.outputs.build_git_sha }}
      build_uuid: ${{ steps.build_metadata.outputs.build_uuid }}
      build_version: ${{ steps.build_metadata.outputs.build_version }}
      is_tag_release: ${{ steps.build_metadata.outputs.is_tag_release }}
      previous_tag: ${{ steps.build_metadata.outputs.previous_tag }}
      release_tag: ${{ steps.build_metadata.outputs.release_tag }}
      release_title: ${{ steps.build_metadata.outputs.release_title }}
      target_sha: ${{ steps.build_metadata.outputs.target_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Generate shared build metadata
        id: build_metadata
        shell: bash
        run: |
          set -euo pipefail
          build_epoch="$(date +%s)"
          target_sha="$(git rev-parse HEAD)"
          build_git_sha="$target_sha"
          build_timestamp="$(TZ=Asia/Taipei date --date="@$build_epoch" +%m%d%H%M)"
          build_version="${build_git_sha:0:7}.${build_timestamp}"
          build_uuid="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            app_version="$(node scripts/release/version.mjs compute "$build_epoch" | sed -n 's/^app_version=//p')"
            release_tag="NeriPlayer-${app_version}"
            release_title="NeriPlayer ${app_version}"
            is_tag_release=false
            previous_tag_pattern='refs/tags/NeriPlayer-*'
          else
            release_tag="${{ github.ref_name }}"
            app_version="${release_tag#v}"
            release_title="NeriPlayer ${app_version}"
            is_tag_release=true
            previous_tag_pattern='refs/tags/v*'
          fi
          previous_tag="$(git for-each-ref --merged "$target_sha" --sort=-creatordate \
            --format='%(refname:short)' "$previous_tag_pattern" \
            | grep -Fvx "$release_tag" | head -n 1 || true)"
          [[ "$build_version" =~ ^[0-9a-f]{7}\.[0-9]{8}$ ]]
          [[ -n "$app_version" ]]
          [[ "$build_uuid" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]

          {
            echo "app_version=$app_version"
            echo "build_epoch=$build_epoch"
            echo "build_git_sha=$build_git_sha"
            echo "build_uuid=$build_uuid"
            echo "build_version=$build_version"
            echo "is_tag_release=$is_tag_release"
            echo "previous_tag=$previous_tag"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

          echo "App version: $app_version"
          echo "Build version: $build_version"
          echo "Build UUID: $build_uuid"
          {
            echo "### Build metadata"
            echo ""
            echo "- App version: \`$app_version\`"
            echo "- Build UUID: \`$build_uuid\`"
            echo "- Build version: \`$build_version\`"
            echo "- Git SHA: \`$build_git_sha\`"
            echo "- Release tag: \`$release_tag\`"
            echo "- Previous release tag: \`${previous_tag:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build metadata artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "app_version=${{ steps.build_metadata.outputs.app_version }}"
            echo "build_uuid=${{ steps.build_metadata.outputs.build_uuid }}"
            echo "build_version=${{ steps.build_metadata.outputs.build_version }}"
            echo "build_git_sha=${{ steps.build_metadata.outputs.build_git_sha }}"
            echo "build_epoch=${{ steps.build_metadata.outputs.build_epoch }}"
            echo "release_tag=${{ steps.build_metadata.outputs.release_tag }}"
            echo "target_sha=${{ steps.build_metadata.outputs.target_sha }}"
            echo "previous_tag=${{ steps.build_metadata.outputs.previous_tag }}"
            echo "github_sha=${{ github.sha }}"
            echo "github_ref=${{ github.ref }}"
            echo "github_run_id=${{ github.run_id }}"
            echo "github_run_number=${{ github.run_number }}"
          } > artifacts/build-metadata.txt

      - name: Persist build metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeriPlayer-build-metadata-${{ steps.build_metadata.outputs.release_tag }}
          path: artifacts/build-metadata.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Check version consistency
        env:
          RELEASE_TAG: ${{ steps.build_metadata.outputs.release_tag }}
          REQUIRE_SEMVER_TAG: ${{ steps.build_metadata.outputs.is_tag_release }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'))
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
          const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8')
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1]
          const lockPackage = cargoLock.match(
            /\[\[package\]\]\s+name = "neri-player-desktop"\s+version = "([^"]+)"/m,
          )?.[1]
          const expectedTag = `v${packageJson.version}`

          const errors = []
          if (process.env.REQUIRE_SEMVER_TAG === 'true' && process.env.RELEASE_TAG !== expectedTag) {
            errors.push(`tag ${process.env.RELEASE_TAG} must equal ${expectedTag}`)
          }
          if (cargoVersion !== packageJson.version) {
            errors.push(`Cargo.toml version ${cargoVersion} must equal ${packageJson.version}`)
          }
          if (lockPackage !== packageJson.version) {
            errors.push(`Cargo.lock version ${lockPackage} must equal ${packageJson.version}`)
          }
          if (tauriConfig.version !== '../package.json') {
            errors.push('tauri.conf.json version must reference ../package.json')
          }

          if (errors.length > 0) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          NODE

  ffmpeg:
    name: FFmpeg
    needs: validate
    uses: ./.github/workflows/ffmpeg.yml
    with:
      ref: ${{ needs.validate.outputs.target_sha }}

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: [validate, ffmpeg]
    runs-on: ${{ matrix.platform }}
    # Linux 在 ubuntu:22.04 容器里构建，把产物的 glibc 下限固定在 2.35，不随托管 runner 升级漂移；
    # 其他平台的 matrix.container 为空，直接在 runner 上运行
    container: ${{ matrix.container }}
    timeout-minutes: 90
    env:
      NERI_BUILD_EPOCH: ${{ needs.validate.outputs.build_epoch }}
      NERI_BUILD_GIT_SHA: ${{ needs.validate.outputs.build_git_sha }}
      NERI_BUILD_UUID: ${{ needs.validate.outputs.build_uuid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            os: windows
            target: x86_64-pc-windows-msvc
            ffmpeg_target: windows-x86_64
            bundles: nsis
            artifact_name: windows-x86_64
            update_platform: windows-x86_64
          - platform: macos-15
            os: macos
            target: aarch64-apple-darwin
            ffmpeg_target: macos-aarch64
            bundles: dmg
            deployment_target: '11.0'
            expected_arch: arm64
            artifact_name: macos-apple-silicon-adhoc
            update_platform: macos-aarch64
          - platform: macos-15
            os: macos
            target: x86_64-apple-darwin
            ffmpeg_target: macos-x86_64
            bundles: dmg
            deployment_target: '10.15'
            expected_arch: x86_64
            artifact_name: macos-intel-adhoc
            update_platform: macos-x86_64
          - platform: ubuntu-22.04
            container: ubuntu:22.04
            os: linux
            target: x86_64-unknown-linux-gnu
            ffmpeg_target: linux-x86_64
            bundles: deb,rpm,appimage
            artifact_name: linux-x86_64
            update_platform: linux-x86_64

    steps:
      # 裸 ubuntu:22.04 镜像没有 git，checkout 需要它拉取完整历史与子模块
      - name: Bootstrap Linux container
        if: matrix.os == 'linux'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: bash scripts/linux/install-build-deps.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download FFmpeg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-${{ matrix.ffmpeg_target }}
          path: .cache/ffmpeg-build/${{ matrix.ffmpeg_target }}

      # 手动发布把时间戳版本写进 package.json 与 Cargo，安装包文件名和系统里看到的版本随之更新；
      # tag 发布的版本已由 validate 核对，只生成空配置
      - name: Stamp release version
        shell: bash
        env:
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
          IS_TAG_RELEASE: ${{ needs.validate.outputs.is_tag_release }}
        run: |
          set -euo pipefail
          if [[ "$IS_TAG_RELEASE" == "true" ]]; then
            mkdir -p .cache/release
            echo '{}' > .cache/release/tauri.version.json
          else
            node scripts/release/version.mjs stamp "$APP_VERSION" .cache/release/tauri.version.json
          fi
          cat .cache/release/tauri.version.json

      # 核对动态库与 BUILDINFO.txt 一致，生成合并进安装包的配置
      - name: Prepare FFmpeg bundle config
        run: node scripts/ffmpeg/bundle-config.mjs ${{ matrix.ffmpeg_target }}

      - name: Build Windows and Linux packages
        if: matrix.os != 'macos'
        env:
          # 容器里没有 FUSE，linuxdeploy 等 AppImage 工具改为解包后运行
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: >-
          pnpm tauri build --ci
          --target ${{ matrix.target }}
          --bundles "${{ matrix.bundles }}"
          --config .cache/ffmpeg-build/${{ matrix.ffmpeg_target }}/tauri.bundle.json
          --config .cache/release/tauri.version.json
          -- --locked

      - name: Build ad-hoc signed macOS package
        if: matrix.os == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: >-
          pnpm tauri build --ci
          --target ${{ matrix.target }}
          --bundles dmg
          --config .cache/ffmpeg-build/${{ matrix.ffmpeg_target }}/tauri.bundle.json
          --config .cache/release/tauri.version.json
          --config '{"bundle":{"macOS":{"minimumSystemVersion":"${{ matrix.deployment_target }}"}}}'
          -- --locked

      - name: Verify macOS ad-hoc package
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          dmgs=("$bundle_root"/dmg/*.dmg)
          (( ${#dmgs[@]} == 1 ))
          dmg_path="${dmgs[0]}"

          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -readonly -quiet
          apps=("$mount_dir"/*.app)
          (( ${#apps[@]} == 1 ))
          delivered_app="${apps[0]}"
          codesign --verify --deep --strict --verbose=4 "$delivered_app"
          # 应用内增量更新以用户实际安装的 .app 为准，路径相对 .app 根目录
          mkdir -p update-tree
          # COPYFILE_DISABLE：不把扩展属性打成 ._ 文件，否则清单里会多出发布包没有的文件
          COPYFILE_DISABLE=1 tar -cf "update-tree/${{ matrix.update_platform }}.tar" -C "$delivered_app" .

          # 随包的 FFmpeg 在 Frameworks 里且签名有效（Apple Silicon 不加载无效签名的代码）
          for library in .cache/ffmpeg-build/${{ matrix.ffmpeg_target }}/*.dylib; do
            bundled="$delivered_app/Contents/Frameworks/$(basename "$library")"
            test -f "$bundled"
            codesign --verify --strict "$bundled"
            [[ "$(lipo -archs "$bundled")" == '${{ matrix.expected_arch }}' ]]
          done
          test -f "$delivered_app/Contents/Resources/ffmpeg/LICENSE.txt"

          signature_info="$(codesign -dvvv "$delivered_app" 2>&1)"
          grep -Fq 'Signature=adhoc' <<< "$signature_info"
          grep -Fq 'TeamIdentifier=not set' <<< "$signature_info"

          executable_name="$(plutil -extract CFBundleExecutable raw "$delivered_app/Contents/Info.plist")"
          executable="$delivered_app/Contents/MacOS/$executable_name"
          test -x "$executable"

          architectures="$(lipo -archs "$executable")"
          [[ "$architectures" == '${{ matrix.expected_arch }}' ]]

          minimum_system_version="$(plutil -extract LSMinimumSystemVersion raw "$delivered_app/Contents/Info.plist")"
          [[ "$minimum_system_version" == '${{ matrix.deployment_target }}' ]]

          macho_minimum="$(otool -l "$executable" | awk '
            $1 == "cmd" && $2 == "LC_BUILD_VERSION" { found=1; next }
            found && $1 == "minos" { print $2; exit }
          ')"
          [[ "$macho_minimum" == '${{ matrix.deployment_target }}' ]]

      - name: Stage macOS artifact
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          destination="artifacts/${{ matrix.artifact_name }}"
          mkdir -p "$destination"
          shopt -s nullglob
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          (( ${#dmgs[@]} == 1 ))
          source_dmg="${dmgs[0]}"
          dmg_name="$(basename "$source_dmg" .dmg)"
          cp "$source_dmg" "$destination/${dmg_name}-adhoc.dmg"

      - name: Stage Windows artifacts
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $destination = "artifacts/${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          $packages = @(Get-ChildItem "$bundleRoot/nsis/*.exe" -ErrorAction SilentlyContinue)
          if ($packages.Count -eq 0) {
            throw "No Windows installer was generated"
          }

          # 安装包要带上随包的 FFmpeg
          $libraries = Get-ChildItem ".cache/ffmpeg-build/${{ matrix.ffmpeg_target }}/*.dll" | ForEach-Object Name
          foreach ($installer in Get-ChildItem "$bundleRoot/nsis/*.exe") {
            $listing = & 7z l $installer.FullName
            foreach ($library in $libraries) {
              if (-not ($listing -match [regex]::Escape("ffmpeg\$library"))) { throw "$($installer.Name) is missing ffmpeg\$library" }
            }
          }
          $packages | Copy-Item -Destination $destination

      # 应用内增量更新比对的是安装后的目录，直接静默装一遍取真实文件树；也顺带验证安装器能装上
      - name: Export Windows install tree
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No NSIS installer was generated" }
          $installDir = Join-Path $env:RUNNER_TEMP "neri-install"
          $process = Start-Process $setup.FullName -ArgumentList '/S', '/NS', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'neri-player-desktop.exe'))) { throw "Silent install did not produce the main executable" }
          if (-not (Test-Path (Join-Path $installDir 'uninstall.exe'))) { throw "Silent install did not write the uninstaller" }
          New-Item -ItemType Directory -Force -Path update-tree | Out-Null
          tar -cf "update-tree/${{ matrix.update_platform }}.tar" -C $installDir .

      - name: Check Linux glibc floor
        if: matrix.os == 'linux'
        shell: bash
        run: >-
          bash scripts/linux/check-glibc.sh --max 2.35
          src-tauri/target/${{ matrix.target }}/release/neri-player-desktop
          .cache/ffmpeg-build/${{ matrix.ffmpeg_target }}

      - name: Validate and stage Linux artifacts
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          destination="artifacts/${{ matrix.artifact_name }}"
          mkdir -p "$destination"
          shopt -s nullglob

          deb_packages=("$bundle_root"/deb/*.deb)
          rpm_packages=("$bundle_root"/rpm/*.rpm)
          app_images=("$bundle_root"/appimage/*.AppImage)

          (( ${#deb_packages[@]} > 0 ))
          (( ${#rpm_packages[@]} > 0 ))
          (( ${#app_images[@]} > 0 ))

          # 每种包都要带上随包的 FFmpeg
          libraries=()
          for library in .cache/ffmpeg-build/${{ matrix.ffmpeg_target }}/*.so.*; do
            libraries+=("$(basename "$library")")
          done
          (( ${#libraries[@]} > 0 ))

          for package in "${deb_packages[@]}"; do
            dpkg-deb --info "$package" >/dev/null
            contents="$(dpkg-deb -c "$package")"
            for library in "${libraries[@]}"; do grep -q "ffmpeg/$library\$" <<< "$contents"; done
            cp "$package" "$destination/"
          done

          for package in "${rpm_packages[@]}"; do
            rpm -qip "$package" >/dev/null
            contents="$(rpm -qlp "$package")"
            for library in "${libraries[@]}"; do grep -q "ffmpeg/$library\$" <<< "$contents"; done
            cp "$package" "$destination/"
          done

          for app_image in "${app_images[@]}"; do
            app_image_path="$(realpath "$app_image")"
            chmod +x "$app_image_path"
            extract_dir="$(mktemp -d)"
            (cd "$extract_dir" && "$app_image_path" --appimage-extract >/dev/null)
            for library in "${libraries[@]}"; do
              find "$extract_dir/squashfs-root" -path "*/ffmpeg/$library" | grep -q .
            done
            rm -rf "$extract_dir"
            mkdir -p update-tree/appimage
            cp "$app_image_path" update-tree/appimage/NeriPlayer.AppImage
            tar -C "$(dirname "$app_image_path")" -czf \
              "$destination/$(basename "$app_image_path").tar.gz" \
              "$(basename "$app_image_path")"
          done

      - name: Package Linux update tree
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          test -f update-tree/appimage/NeriPlayer.AppImage
          tar -cf "update-tree/${{ matrix.update_platform }}.tar" -C update-tree/appimage NeriPlayer.AppImage
          rm -rf update-tree/appimage

      # 名字不以 NeriPlayer- 开头，避免被发布任务当成安装包一起上传
      - name: Upload update tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-tree-${{ matrix.update_platform }}-${{ needs.validate.outputs.release_tag }}
          path: update-tree/${{ matrix.update_platform }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeriPlayer-${{ matrix.artifact_name }}-${{ needs.validate.outputs.release_tag }}
          path: artifacts/${{ matrix.artifact_name }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # 可选渠道：release 不依赖它，flatpak.yml 内部 continue-on-error，失败不影响发布
  flatpak:
    name: Flatpak
    needs: [validate, build]
    uses: ./.github/workflows/flatpak.yml
    with:
      ref: ${{ needs.validate.outputs.target_sha }}
      deb_artifact: NeriPlayer-linux-x86_64-${{ needs.validate.outputs.release_tag }}
      app_version: ${{ needs.validate.outputs.app_version }}

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NeriPlayer-*-${{ needs.validate.outputs.release_tag }}
          path: release-assets
          merge-multiple: true

      # 安装包里带着 FFmpeg 的 LGPL 动态库：同一发布附上构建它们的完整源码
      - name: Attach FFmpeg source
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^readonly FFMPEG_VERSION=//p' scripts/ffmpeg/build-ffmpeg.sh)"
          sha256="$(sed -n 's/^readonly FFMPEG_SHA256=//p' scripts/ffmpeg/build-ffmpeg.sh)"
          [[ -n "$version" && -n "$sha256" ]]
          archive="release-assets/ffmpeg-${version}.tar.xz"
          curl -fsSL --retry 3 -o "$archive" "https://ffmpeg.org/releases/ffmpeg-${version}.tar.xz"
          echo "$sha256  $archive" | sha256sum -c -
          cp scripts/ffmpeg/build-ffmpeg.sh release-assets/ffmpeg-build.sh

      - name: Download update trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: update-tree-*-${{ needs.validate.outputs.release_tag }}
          path: update-trees
          merge-multiple: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-update-tool

      # 应用内增量更新：每个平台一个完整内容 blob，加上相对上一版的补丁，清单用 Ed25519 签名。
      # 仓库里没有配置公钥时应用内更新是关闭的，这一步跳过；配置了公钥却没有私钥则发布失败
      - name: Build incremental update assets
        env:
          GH_TOKEN: ${{ github.token }}
          NERI_UPDATE_SIGNING_KEY: ${{ secrets.NERI_UPDATE_SIGNING_KEY }}
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
          BUILD_EPOCH: ${{ needs.validate.outputs.build_epoch }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          public_key="$(grep -v '^[[:space:]]*#' src-tauri/update-public-key.txt | tr -d '[:space:]' || true)"
          if [[ -z "$public_key" ]]; then
            echo "::notice title=In-app updates disabled::src-tauri/update-public-key.txt has no public key; skipping update assets"
            exit 0
          fi
          if [[ -z "$NERI_UPDATE_SIGNING_KEY" ]]; then
            echo "::error title=Missing signing key::set the NERI_UPDATE_SIGNING_KEY secret or clear src-tauri/update-public-key.txt"
            exit 1
          fi

          cargo build --manifest-path src-tauri/Cargo.toml --locked --release \
            -p neri-update --no-default-features --bin neri-update-tool
          tool=src-tauri/target/release/neri-update-tool

          # 上一版的清单与完整 blob 用来生成补丁；上一版还没有增量资产时只做文件级比对
          base_args=()
          if [[ -n "$PREVIOUS_TAG" ]] && gh release download "$PREVIOUS_TAG" --repo "$REPO" \
              --pattern neri-update.json --pattern '*.update' --dir previous-release 2>/dev/null; then
            base_args=(--base-manifest previous-release/neri-update.json --base-blobs previous-release)
          else
            echo "::notice title=No patch base::$PREVIOUS_TAG has no incremental update assets"
          fi

          base_url="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          mkdir -p update-out
          for archive in update-trees/*.tar; do
            platform="$(basename "$archive" .tar)"
            tree="update-trees/$platform"
            mkdir -p "$tree"
            tar -xf "$archive" -C "$tree"
            target="$tree"
            if [[ "$platform" == linux-* ]]; then
              target="$tree/NeriPlayer.AppImage"
            fi
            "$tool" pack --platform "$platform" --tree "$target" \
              --stem "NeriPlayer-${APP_VERSION}-${platform}" --base-url "$base_url" \
              --out update-out --exclude uninstall.exe "${base_args[@]}"
          done

          "$tool" finalize --version "$APP_VERSION" --build-epoch "$BUILD_EPOCH" \
            --release-tag "$RELEASE_TAG" --release-url "https://github.com/${REPO}/releases/tag/${RELEASE_TAG}" \
            --fragments update-out --out update-out --public-key "$public_key"
          "$tool" verify --manifest update-out/neri-update.json --public-key "$public_key"
          cp update-out/neri-update.json update-out/neri-update.json.sig update-out/*.update release-assets/
          if compgen -G 'update-out/*.patch' >/dev/null; then cp update-out/*.patch release-assets/; fi

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          required_patterns=(
            '*.dmg'
            '*.exe'
            '*.deb'
            '*.rpm'
            '*.AppImage.tar.gz'
            'ffmpeg-*.tar.xz'
          )

          for pattern in "${required_patterns[@]}"; do
            matches=(release-assets/$pattern)
            if (( ${#matches[@]} == 0 )); then
              echo "::error title=Missing release asset::No file matched $pattern"
              exit 1
            fi
          done

          cat > macOS-install.txt <<'EOF'
          NeriPlayer for macOS uses a free ad-hoc signature and is not notarized by Apple.

          First launch:
          1. Drag NeriPlayer.app into Applications
          2. Try to open it once
          3. Open System Settings > Privacy & Security
          4. Click Open Anyway for NeriPlayer

          Terminal fallback:
          xattr -dr com.apple.quarantine "/Applications/NeriPlayer.app"
          open "/Applications/NeriPlayer.app"
          EOF
          cp macOS-install.txt release-assets/macOS-install.txt
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
          BUILD_UUID: ${{ needs.validate.outputs.build_uuid }}
          BUILD_VERSION: ${{ needs.validate.outputs.build_version }}
        shell: bash
        run: |
          set -euo pipefail

          api_args=(
            --method POST
            "repos/${REPO}/releases/generate-notes"
            -f "tag_name=${RELEASE_TAG}"
            -f "target_commitish=${TARGET_SHA}"
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            api_args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi
          gh api "${api_args[@]}" --jq '.body' > generated-release-notes.md

          node scripts/release/download-table.mjs \
            "$REPO" "$RELEASE_TAG" release-assets "$PREVIOUS_TAG" > release-notes.md
          {
            echo
            echo "## macOS first launch"
            echo
            echo '```text'
            cat macOS-install.txt
            echo '```'
          } >> release-notes.md
          {
            echo
            echo
            echo "## Build metadata"
            echo
            echo "- App version: \`${APP_VERSION}\`"
            echo "- Build UUID: \`${BUILD_UUID}\`"
            echo "- Build version: \`${BUILD_VERSION}\`"
            echo "- Target commit: \`${TARGET_SHA}\`"
            echo
            echo "## Commits"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log --first-parent --pretty='- %h %s' "${PREVIOUS_TAG}..${TARGET_SHA}"
            else
              git log --first-parent --pretty='- %h %s' "$TARGET_SHA"
            fi
          } >> release-notes.md

          if [[ -s generated-release-notes.md ]]; then
            {
              echo
              echo
              echo "## Changes"
              cat generated-release-notes.md
            } >> release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG_RELEASE: ${{ needs.validate.outputs.is_tag_release }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.validate.outputs.release_title }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
            exit 0
          fi

          prerelease=()
          latest=()
          if [[ "$IS_TAG_RELEASE" == "true" && "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          else
            latest+=(--latest)
          fi

          create_args=(
            gh release create "$RELEASE_TAG" release-assets/*
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
          )
          if [[ "$IS_TAG_RELEASE" == "true" ]]; then
            create_args+=(--verify-tag)
          else
            create_args+=(--target "$TARGET_SHA")
          fi
          create_args+=("${prerelease[@]}" "${latest[@]}")
          "${create_args[@]}"
