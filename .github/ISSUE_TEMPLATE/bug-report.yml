name: Bug report / 问题报告
description: 报告可复现的问题，帮助我们改进 NeriPlayer Desktop / Report a reproducible problem
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 NeriPlayer Desktop 的问题
        请完整填写复现信息，并在日志、截图中移除隐私数据

        Thank you for reporting an issue with NeriPlayer Desktop
        Please provide complete reproduction details and remove private data from logs or screenshots

  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述 / Problem description
      description: 清楚说明问题发生的场景和影响 / Clearly describe when the issue occurs and its impact
      placeholder: 简要描述你遇到的问题 / Briefly describe the problem
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开某个页面或功能
        2. 执行具体操作
        3. 观察到问题

        1. Open a page or feature
        2. Perform the specific action
        3. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为 / Expected behavior
      placeholder: 正常情况下应该发生什么 / What should happen instead
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为 / Actual behavior
      description: 可附截图或录屏，请先隐藏个人信息 / Screenshots or recordings are welcome after removing personal data
      placeholder: 实际发生了什么 / What actually happened
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: 问题模块 / Affected area
      options:
        - 安装、启动或更新 / Installation, startup, or update
        - 音频播放 / Audio playback
        - 网易云音乐 / NetEase Cloud Music
        - QQ 音乐 / QQ Music
        - Bilibili
        - YouTube
        - 本地音乐 / Local music
        - 歌词 / Lyrics
        - 下载 / Downloads
        - 云同步 / Cloud sync
        - 一起听 / Listen Together
        - 界面或交互 / UI or interaction
        - 其他 / Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 应用版本与构建信息 / App version and build information
      description: >-
        在设置页「关于」中点击右侧复制图标即可复制版本号。只需填写构建版本，无需 Build UUID /
        Open Settings → About and click the copy icon on the right. Only the build version is needed; Build UUID is not required
      placeholder: >-
        例如 38547d9.07210803 /
        For example 38547d9.07210803
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: 安装来源 / Distribution
      options:
        - GitHub Release
        - GitHub Actions CI
        - 本地源码构建 / Local source build
        - 其他 / Other
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统 / Operating system
      options:
        - Windows
        - macOS
        - Linux
        - 其他 / Other
    validations:
      required: true

  - type: input
    id: operating-system-version
    attributes:
      label: 操作系统版本 / Operating system version
      placeholder: 例如 Windows 11 24H2、macOS 15.5、Ubuntu 22.04
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: CPU 架构 / CPU architecture
      options:
        - x86_64
        - arm64 / aarch64
        - 不确定 / Unsure
        - 其他 / Other
    validations:
      required: true

  - type: dropdown
    id: package-format
    attributes:
      label: 安装包类型 / Package format
      options:
        - DMG
        - MSI
        - EXE
        - AppImage
        - DEB
        - RPM
        - 本地开发模式 / Local development mode
        - 其他或不适用 / Other or not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与错误信息 / Logs and error messages
      description: 可附终端输出、错误提示或调试页探针结果，提交前请删除敏感信息 / Attach terminal output, errors, or Debug page probe results after removing sensitive data
      render: shell
    validations:
      required: false

  - type: textarea
    id: playback-sync-context
    attributes:
      label: 播放、网络与同步环境 / Playback, network, and sync context
      description: >-
        相关时填写来源与音质、输出设备、是否绕过系统代理、同步后端，以及 Android 是否正常。
        跨端问题请填写两端构建版本；不要填写 Cookie、Token、带签名的取流链接或私有服务器地址 /
        When relevant, include source and quality, output device, proxy bypass setting, sync backend,
        and Android behavior. Include both build versions for cross-platform issues.
        Do not include cookies, tokens, signed stream links, or private server addresses
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: 补充说明 / Additional information
      description: 提供其他可能有助于定位问题的信息 / Add any other details that may help diagnose the problem
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认 / Confirmation
      options:
        - label: 我已搜索 [Issue Tracker](https://github.com/cwuom/NeriPlayer-Desktop/issues)，没有发现相同问题 / I searched the Issue Tracker and found no duplicate
          required: true
        - label: 我已尽可能在最新 Release 或 CI 构建中复现问题 / I reproduced the issue on the latest Release or CI build when possible
          required: true
        - label: 我已从日志和截图中移除 Cookie、Token、密钥及其他敏感信息 / I removed cookies, tokens, keys, and other secrets from logs and screenshots
          required: true
