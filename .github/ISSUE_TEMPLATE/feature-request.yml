name: Feature request / 功能请求
description: 提议一项明确的新功能，并说明实际使用场景 / Propose a new capability and its use case
title: "[Feature] "
labels: ["enhancement", "status: needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你为 NeriPlayer Desktop 提出新功能建议！
        只需说明要解决的问题、使用场景、期望功能和涉及模块，无需提供应用版本、构建 UUID 或安装来源。
        优化已有体验请使用“优化建议”模板；附件中请移除账号和密钥等隐私信息。
        与 Android 端共享的功能（云同步、一起听协议等）请说明跨端兼容的期望。

        Thank you for proposing a feature for NeriPlayer Desktop!
        Describe the problem, use case, proposed feature, and affected areas. No app version, Build UUID, or distribution details are needed.
        Use the suggestion form for existing behavior and redact private data from attachments.
        For features shared with Android (cloud sync, Listen Together protocol, etc.), describe the expected cross-platform behavior.

  - type: textarea
    id: motivation
    attributes:
      label: 功能背景与需求 / Motivation
      description: 当前遇到了什么限制？谁会在什么场景使用此功能？ / Describe the limitation, users, and use case
      placeholder: |
        用简洁的语言描述你需要的功能（例如：支持迷你播放器窗口置顶）
        说明你需要此功能的场景或痛点（例如：写代码时希望随时看到歌词并切歌）

        Describe the feature you need concisely (e.g.: Support an always-on-top mini player window)
        Explain the scenario or pain point (e.g.: I want to see lyrics and skip tracks while coding)
    validations:
      required: true

  - type: textarea
    id: proposed-feature
    attributes:
      label: 期望的功能 / Proposed feature
      description: 说明期望行为和完成标准，可附已有功能或相关 Issue / Describe the expected behavior and acceptance criteria
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 已尝试的办法或当前临时解决方式；没有可留空 / Describe alternatives or workarounds if any
    validations:
      required: false

  - type: dropdown
    id: affected-area
    attributes:
      label: 涉及模块 / Affected area
      description: 必填，可多选；不确定时选择“其他或不确定”，提交后会自动添加模块标签 / Required, multiple choices allowed; area labels are added automatically
      multiple: true
      options:
        - 账号与登录 / Accounts and login
        - 播放与音频 / Playback and audio
        - 音频输出设备 / Audio output devices
        - 系统媒体控制与快捷键 / System media controls and shortcuts
        - 网络与代理 / Network and proxy
        - 歌词 / Lyrics
        - 下载与存储 / Downloads and storage
        - 本地音乐与歌单 / Local music and playlists
        - 云同步与备份 / Cloud sync and backup
        - 一起听 / Listen Together
        - 界面与窗口 / UI and window
        - 性能与资源占用 / Performance and resource usage
        - 文档与翻译 / Documentation and translation
        - 构建、CI 与发布 / Build and CI and release
        - 安装、启动与更新 / Installation and startup and update
        - 其他或不确定 / Other or unsure
    validations:
      required: true

  - type: dropdown
    id: affected-platforms
    attributes:
      label: 涉及平台 / Affected platforms
      description: 可选，可多选；仅当功能针对特定平台时填写 / Optional; select only if the feature targets specific platforms
      multiple: true
      options:
        - 网易云音乐 / NetEase Cloud Music
        - QQ 音乐 / QQ Music
        - Bilibili
        - YouTube Music
        - 本地音频或下载文件 / Local audio or downloaded files
        - 不涉及在线平台 / Not related to online platforms
        - 其他或不确定 / Other or unsure
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 补充材料 / Additional context
      description: 可附截图、参考产品、相关 Issue；跨端功能请说明与 Android 端的关系 / Add references and note Android compatibility when relevant
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认 / Confirmation
      options:
        - label: 我确认本 Issue 只提交一个问题；多个问题需要分多个 Issue 提交，否则只有第一个问题会被考虑 / I confirm this issue covers only one topic; multiple topics require separate issues, otherwise only the first will be considered
          required: true
        - label: 我已搜索现有 Issue，未找到相同或高度相似的功能请求 / I searched existing issues and found no duplicate request
          required: true
        - label: 我已说明此功能要解决的问题和使用场景 / I described the problem and use case
          required: true
