name: Suggestion / 优化建议
description: 提出现有功能、交互或性能方面的优化建议 / Suggest an improvement to existing behavior, UX, or performance
title: "[Suggestion] "
labels: ["enhancement", "status: needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你为 NeriPlayer Desktop 提出优化建议！
        此模板用于改进现有功能、交互或性能；全新能力请使用“功能请求”模板。
        请说明当前痛点和改进后的收益，附件中请移除账号和密钥等隐私信息。
        下拉框中的“请选择”仅为填写提示，请改为实际情况后再提交。

        Thank you for suggesting an improvement to NeriPlayer Desktop!
        Use this form to improve existing behavior, UX, or performance; use the feature request form for a new capability.
        Describe the pain point and concrete benefit, and redact private data from attachments.
        Replace "Please select" in dropdowns with the actual value before submitting.

  - type: textarea
    id: suggestion-overview
    attributes:
      label: 建议概述 / Suggestion overview
      placeholder: |
        用简洁的语言描述你的建议（例如：统一歌单页封面区与歌曲列表的背景样式）

        Describe your suggestion concisely (e.g.: Unify the background styles of the playlist cover area and the track list)
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 建议的背景与原因 / Background & Reason for Suggestion
      placeholder: 说明你提出此建议的场景或痛点 / Explain the scenario or pain point that leads to this suggestion
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: 建议的具体实施方案 / Detailed Implementation Plan (Optional)
      placeholder: （可选）描述你期望的改进方式 / (Optional) Describe your expected improvement
    validations:
      required: false

  - type: textarea
    id: expected-result
    attributes:
      label: 预期效果 / Expected Effect
      placeholder: 说明建议实施后能带来的改善 / Explain the improvements after implementation
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: 涉及模块 / Affected area
      description: 可多选；请选择希望改进的模块 / Select the areas you would like to improve
      multiple: true
      options:
        - 账号与登录 / Accounts and login
        - 播放与音频 / Playback and audio
        - 音频输出设备 / Audio output devices
        - 系统媒体控制与快捷键 / System media controls and shortcuts
        - 网络与代理 / Network and proxy
        - 歌词 / Lyrics
        - 下载与存储 / Downloads and storage
        - 本地音乐与歌单 / Local music and playlists
        - 云同步与备份 / Cloud sync and backup
        - 一起听 / Listen Together
        - 界面与窗口 / UI and window
        - 性能与资源占用 / Performance and resource usage
        - 文档与翻译 / Documentation and translation
        - 构建、CI 与发布 / Build and CI and release
        - 安装、启动与更新 / Installation and startup and update
        - 其他或不确定 / Other or unsure
    validations:
      required: true

  - type: dropdown
    id: affected-platforms
    attributes:
      label: 涉及平台 / Affected platforms
      description: 可多选；不依赖在线平台时选择“不涉及在线平台” / Select all affected platforms or choose not related
      multiple: true
      options:
        - 网易云音乐 / NetEase Cloud Music
        - QQ 音乐 / QQ Music
        - Bilibili
        - YouTube Music
        - 本地音频或下载文件 / Local audio or downloaded files
        - 不涉及在线平台 / Not related to online platforms
        - 其他或不确定 / Other or unsure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 应用版本与构建信息 / App version and build information
      description: 从设置的「关于」复制版本号；无法确认可填“未知” / Copy the version from About or enter unknown
      placeholder: 例如 38547d9.07210803，或未知 / For example 38547d9.07210803, or unknown
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统 / Operating system
      default: 0
      options:
        - 请选择 / Please select
        - Windows
        - macOS
        - Linux
        - 其他或不确定 / Other or unsure
    validations:
      required: true

  - type: textarea
    id: related-features
    attributes:
      label: 关联的现有功能（可选） / Associated Existing Features (Optional)
      placeholder: （可选）若建议与现有功能相关，请列出 / (Optional) List related existing features
    validations:
      required: false

  - type: textarea
    id: additional-materials
    attributes:
      label: 补充材料（可选） / Supplementary Materials (Optional)
      placeholder: （可选）可粘贴参考截图、设计草图链接或其他辅助材料 / (Optional) Reference screenshots, sketches, or other materials
    validations:
      required: false

  - type: checkboxes
    id: duplication-check
    attributes:
      label: 提交前确认 / Confirmation Before Submission
      options:
        - label: 我确认本 Issue 只提交一个问题；多个问题需要分多个 Issue 提交，否则只有第一个问题会被考虑 / I confirm this issue covers only one topic; multiple topics require separate issues, otherwise only the first will be considered
          required: true
        - label: 我已搜索现有 Issue，未找到相同或高度相似的建议 / I searched existing issues and found no duplicate suggestion
          required: true
        - label: 我已说明当前痛点和预期改善 / I described the current pain point and expected improvement
          required: true
