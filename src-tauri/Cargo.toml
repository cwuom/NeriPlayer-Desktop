[package]
name = "neri-player-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# src/bin/ also provides sidecar binaries; without a default Tauri's bundler fails with
# "failed to find main binary"
default-run = "neri-player-desktop"

[workspace]
# 领域 crate 位于 crates/；依赖方向与职责见 docs/implementation.md 与 config/quality/module-boundaries.json
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# 项目内部 crate
neri-common = { path = "crates/neri-common" }
neri-model = { path = "crates/neri-model" }
neri-platform = { path = "crates/neri-platform" }
neri-playback = { path = "crates/neri-playback" }
neri-library = { path = "crates/neri-library" }
neri-listentogether = { path = "crates/neri-listentogether" }

# 第三方依赖：版本集中声明，成员 crate 只引用需要的部分
tauri = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "vorbis", "wav", "pcm", "adpcm"] }
lofty = "0.21"
md-5 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
pbkdf2 = "0.12"
cbc = "0.1"
ecb = "0.1"
rsa = "0.9"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
url = "2"
rand = "0.8"
chrono = "0.4"
iana-time-zone = "0.1"
thiserror = "2"
parking_lot = "0.12"
walkdir = "2"
# 本地音乐文件夹监视：系统原生事件，无轮询
notify = "6.1"
urlencoding = "2"
regex = "1"
# 歌词匹配的文本规整：与 Android 一样先繁转简、再做 NFKC
fast2s = "0.3"
unicode-normalization = "0.1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
whoami = "1"
log = "0.4"
dirs-next = "2"
prost = "0.13"
flate2 = "1"
zstd = "0.13"
rquickjs = { version = "0.14", default-features = false }
quick-xml = "0.39"
souvlaki = "0.7"
raw-window-handle = "0.6"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"
webview2-com = "0.38"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
alsa = "0.9"
# WASAPI 独占输出；与 cpal 0.15 同版本，不会引入第二份 windows crate
windows = { version = "0.54", features = ["Win32_Media_Audio", "Win32_Foundation", "Win32_Devices_Properties", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSToolbar", "NSWindow", "NSView", "NSControl", "NSButton"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"] }
# 监听标题栏视图的 frame 变化（红绿灯被 AppKit 复位时立即摆回）
block2 = "0.6"
cc = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
neri-common.workspace = true
neri-model.workspace = true
neri-platform.workspace = true
neri-playback.workspace = true
neri-library.workspace = true
neri-listentogether.workspace = true
# image-png: 歌词海报复制图片到剪贴板走 Image.fromBytes(PNG)，核心解码需要它
tauri = { workspace = true, features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
lofty.workspace = true
md-5.workspace = true
ecb.workspace = true
hex.workspace = true
base64.workspace = true
url.workspace = true
chrono.workspace = true
parking_lot.workspace = true
urlencoding.workspace = true
regex.workspace = true
sha2.workspace = true
uuid.workspace = true
log.workspace = true
dirs-next.workspace = true
rquickjs.workspace = true
raw-window-handle.workspace = true
futures-util.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tempfile.workspace = true
image.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-single-instance.workspace = true
rusqlite.workspace = true
tauri-plugin-global-shortcut.workspace = true

[target.'cfg(windows)'.dependencies]
# 最小化时把 WebView2 控制器设为不可见；版本跟随 tauri 使用的 webview2-com
webview2-com.workspace = true
# 读取系统强调色（跟随系统取色）
winreg.workspace = true
# 桌面歌词锁定时直接读鼠标左键状态，解锁不依赖穿透窗口能否收到点击
windows-sys.workspace = true
# 任务栏缩略图工具栏（ITaskbarList3 是 COM 接口，windows-sys 没有）；沿用工作区已有的 0.54
windows = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
block2.workspace = true

[profile.dev.package.symphonia]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2

[profile.dev.package.symphonia-codec-aac]
opt-level = 2

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 2

[profile.dev.package.symphonia-format-isomp4]
opt-level = 2

[profile.dev.package.symphonia-format-ogg]
opt-level = 2

# YouTube 签名求解在 QuickJS 里解析整份 player，未优化的解释器要慢一个数量级
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.rquickjs-core]
opt-level = 2
