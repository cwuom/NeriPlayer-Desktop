[package]
name = "neri-player-desktop"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
# src/bin/ also provides sidecar binaries; without a default Tauri's bundler fails with
# "failed to find main binary"
default-run = "neri-player-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# image-png: 歌词海报复制图片到剪贴板走 Image.fromBytes(PNG)，核心解码需要它
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "vorbis", "wav", "pcm", "adpcm"] }
lofty = "0.21"
md-5 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
pbkdf2 = "0.12"
cbc = "0.1"
ecb = "0.1"
rsa = "0.9"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
url = "2"
rand = "0.8"
chrono = "0.4"
iana-time-zone = "0.1"
thiserror = "2"
parking_lot = "0.12"
walkdir = "2"
# 本地音乐文件夹监视：系统原生事件，无轮询
notify = "6.1"
urlencoding = "2"
regex = "1"
# 歌词匹配的文本规整：与 Android 一样先繁转简、再做 NFKC
fast2s = "0.3"
unicode-normalization = "0.1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
whoami = "1"
log = "0.4"
dirs-next = "2"
prost = "0.13"
flate2 = "1"
zstd = "0.13"
rquickjs = { version = "0.14", default-features = false }
quick-xml = "0.39"
souvlaki = "0.7"
raw-window-handle = "0.6"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
# 最小化时把 WebView2 控制器设为不可见；版本跟随 tauri 使用的 webview2-com
webview2-com = "0.38"
# 读取系统强调色（跟随系统取色）
winreg = "0.55"
# 桌面歌词锁定时直接读鼠标左键状态，解锁不依赖穿透窗口能否收到点击
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reads alsa-lib device hints for human readable output labels; same version cpal uses
alsa = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSToolbar", "NSWindow"] }

[profile.dev.package.symphonia]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2

[profile.dev.package.symphonia-codec-aac]
opt-level = 2

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 2

[profile.dev.package.symphonia-format-isomp4]
opt-level = 2

[profile.dev.package.symphonia-format-ogg]
opt-level = 2

# YouTube 签名求解在 QuickJS 里解析整份 player，未优化的解释器要慢一个数量级
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.rquickjs-core]
opt-level = 2
